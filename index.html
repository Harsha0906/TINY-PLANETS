<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<meta name="description" content="Get your own tiny papercraft planet in one tap. Plant trees, temples and chai stalls, watch little paper people stroll around, then fly across a shared universe to visit your friends' worlds. Free, no sign-up." />
<meta name="theme-color" content="#f3e9d6" />
<link rel="canonical" href="https://tiny-planets-paper.netlify.app/" />
<meta property="og:site_name" content="Tiny Planets" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://tiny-planets-paper.netlify.app/" />
<meta property="og:title" content="Tiny Planets 🪐 Build your own little paper world" />
<meta property="og:description" content="Get your own tiny papercraft planet in one tap. Plant trees, temples and chai stalls, then fly over to visit your friends' worlds. Free, no sign-up." />
<meta property="og:image" content="https://tiny-planets-paper.netlify.app/og.jpg" />
<meta property="og:image:secure_url" content="https://tiny-planets-paper.netlify.app/og.jpg" />
<meta property="og:image:type" content="image/jpeg" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Tiny Planets 🪐 Build your own little paper world" />
<meta name="twitter:description" content="Get your own tiny papercraft planet in one tap. Plant trees, temples and chai stalls, then fly over to visit your friends' worlds. Free, no sign-up." />
<meta name="twitter:image" content="https://tiny-planets-paper.netlify.app/og.jpg" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/addons/" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="bubble" class="bubble hidden"></div>

<div id="intro">
  <h1><span>T</span><span>i</span><span>n</span><span>y</span>&nbsp;<span>P</span><span>l</span><span>a</span><span>n</span><span>e</span><span>t</span><span>s</span></h1>
  <p>a little paper world, just for you</p>
</div>

<header id="top" class="ui hidden">
  <button id="nameBtn" class="tag" aria-label="Rename planet"><span id="planetName">Tiny Planet</span><small id="planetMeta"></small></button>
</header>

<button id="btnMusic" class="round ui hidden" aria-label="Music on or off" title="Lo-fi music">🔈</button>
<nav id="side" class="ui hidden">
  <button id="btnUniverse" class="act" title="See everyone's planets"><i>🌌</i><span>Explore</span></button>
  <button id="btnShare" class="act hot" title="Send your planet to friends"><i>🔗</i><span>Share</span></button>
  <button id="btnCinema" class="act" title="10-second time-lapse for reels"><i>🎬</i><span>Video</span></button>
  <button id="btnPostcard" class="act" title="Make a postcard picture"><i>📮</i><span>Postcard</span></button>
  <button id="btnPeek" class="act" title="Peek at daytime"><i>☀️</i><span>Daytime</span></button>
  <button id="btnWeather" class="act mine-only" title="Match my real weather"><i>🌦️</i><span>Weather</span></button>
</nav>

<section id="dock" class="ui hidden">
  <div id="tools">
    <button data-tool="look" class="chip tool" title="Just look around">✋ Look</button>
    <button data-tool="erase" class="chip tool" title="Remove things">🧽 Remove</button>
    <button id="btnUndo" class="chip" title="Undo">↶ Undo</button>
    <button id="btnPalette" class="chip" title="Change ground colour">🎨 Ground</button>
  </div>
  <div id="cats"></div>
  <div id="items"></div>
</section>

<section id="visit" class="ui hidden">
  <div class="visit-card">
    <div class="visit-title">Visiting <b id="visitName"></b></div>
    <div class="visit-row">
      <button id="btnHeart" class="chip">❤️ <span id="heartCount">0</span></button>
      <button id="btnHome" class="chip primary">🏠 My planet</button>
    </div>
  </div>
</section>

<section id="universeBar" class="ui hidden">
  <div class="visit-card">
    <div class="visit-title"><b id="uniCount">1</b> player planets here · tap one to fly over</div>
    <div class="visit-row"><button id="btnMore" class="chip">✨ More planets</button><button id="btnHome2" class="chip primary">🏠 Back to my planet</button></div>
  </div>
</section>

<div id="hint" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="coach" class="hidden"><div class="spot"></div><div class="ccard"><div class="ctext"></div><div class="crow"><button class="chip" id="coachSkip">Skip</button><span class="cstep"></span><button class="chip primary" id="coachNext">Next</button></div></div></div>
<div id="watermark">🪐 Tiny Planets · tiny-planets-paper.netlify.app</div>
<a id="credit" class="ui hidden" target="_blank" rel="noopener" title="Say hi to the maker">made with <span>♥</span> by <b>Harsha</b></a>

<div id="modal" class="hidden">
  <div class="sheet">
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
